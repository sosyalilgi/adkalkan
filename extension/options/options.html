<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="optTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="36" height="36">
    <div>

      <p class="ver"><span data-i18n="optVersionLabel"></span> <span id="version"></span></p>

  <main>
    <p class="intro" data-i18n="optIntro"></p>

    <section class="card highlight">
      <h2 data-i18n="optNoDataTitle"></h2>
      <p data-i18n="optNoDataText"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optHowTitle"></h2>
      <p data-i18n="optHowText"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optPrivacyTitle"></h2>
      <p data-i18n="optPrivacyText"></p>
      <a class="btn" href="https://sosyalilgi.github.io/adkalkan/privacy.html" target="_blank" rel="noreferrer"
         data-i18n="optPrivacyLink"></a>

    <section class="card">
      <h2 data-i18n="optListsTitle"></h2>
      <p data-i18n="optListsText"></p>

        <li><a href="https://easylist.to/easylist/easylist.txt" target="_blank" rel="noreferrer">EasyList</a> — easylist.to</li>

        <li><a href="https://filters.adtidy.org/extension/chromium/filters/13.txt" target="_blank" rel="noreferrer">AdGuard Turkish filter</a> — AdGuard Filters</li>
        <li><a href="https://pgl.yoyo.org/adservers/" target="_blank" rel="noreferrer">Peter Lowe's List</a> — pgl.yoyo.org</li>
      </ul>
    </section>

    <section class="card">
      <h2 data-i18n="optLicenseTitle"></h2>
      <p data-i18n="optLicenseText"></p>
      <a class="btn" href="https://github.com/sosyalilgi/adkalkan/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT License</a>
    </section>

    <section class="card">
      <h2 data-i18n="optSupportTitle"></h2>
      <p>
        <a href="https://github.com/sosyalilgi/adkalkan/issues" target="_blank" rel="noreferrer">GitHub Issues</a> ·
        <a id="mailLink" href="mailto:ferhatdogan55@gmail.com">ferhatdogan55@gmail.com</a> ·
        <a href="https://github.com/sosyalilgi/adkalkan" target="_blank" rel="noreferrer">Source code</a>
      </p>

  <footer data-i18n="optCopyright"></footer>

  <script src="options.js"></script>
